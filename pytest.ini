[tool:pytest]
pythonpath = . app/api
testpaths = app/api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Exclude the broken root tests directory
norecursedirs = tests marathon_predictor garmin_predictions legacy useful_data static
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --ignore=tests/
    --ignore=marathon_predictor/
    --ignore=garmin_predictions/
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
env =
    TESTING = 1
    FLASK_ENV = testing
    DATABASE_URL = sqlite:///:memory:
    PYTHONPATH = .:app/api
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (test component interactions)
    api: API endpoint tests
    database: Database operation tests
    strava: Strava integration tests
    slow: Slow tests (can be skipped with -m "not slow")
    auth: Authentication tests
    prediction: Race prediction tests
    processing: Data processing tests 